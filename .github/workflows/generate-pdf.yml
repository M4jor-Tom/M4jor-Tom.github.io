name: Resumes

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: resume-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Chromium's sandbox works on Ubuntu 22.04 without extra AppArmor rules.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31.11.2
      - name: Install dependencies
        run: nix develop -c npm ci
      - name: Build and check all resumes
        run: nix develop -c npm test
      - name: Export the verified site
        run: nix develop -c node scripts/generate-pdf.mjs
      - name: Upload website
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Upload PDFs
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: resume-pdfs
          path: generated/*.pdf
          if-no-files-found: error

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5

  publish-pdf:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: resume-pdfs
          path: generated
      - name: Publish PDFs
        run: |
          git config user.name 'Tom Vautray'
          git config user.email 'tom-vautray@hotmail.fr'
          git checkout -B pdf-cv-releasing
          git add -f generated/
          git diff --cached --quiet || git commit -m "chore: regenerate resume PDFs"
          git push --force origin HEAD:pdf-cv-releasing
