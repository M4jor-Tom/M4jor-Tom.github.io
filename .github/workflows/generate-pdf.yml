name: PDF Exporting

on:
  push:
    branches: ['master']

permissions:
  contents: write

concurrency:
  group: pdf-export
  cancel-in-progress: false

jobs:
  convert:
    # Ubuntu 22.04 permits Chromium's user-namespace sandbox without extra AppArmor rules.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31.11.2

      - name: Install dependencies
        run: nix develop -c npm ci

      - name: Check PDF export
        run: nix develop -c npm test

      - name: Generate PDF
        run: nix develop -c npm run pdf

      - name: Commit & Push
        run: |
          git config user.name 'Tom Vautray'
          git config user.email 'tom-vautray@hotmail.fr'
          git checkout -B pdf-cv-releasing
          git add -f generated/Tom_Vautray_Software_Engineer_Resume.pdf
          git commit -m "chore: regenerate resume PDF"
          git push --force origin HEAD:pdf-cv-releasing
